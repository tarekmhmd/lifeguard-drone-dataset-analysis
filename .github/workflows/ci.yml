name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      # OpenCV (pulled in by the dashboard extra) needs the system OpenGL library on Ubuntu runners.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # Dashboard dependencies, so the Streamlit page test runs instead of being skipped.
      - name: Install dashboard extra
        run: python -m pip install -e ".[dashboard]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Model registry check
        run: python -m lifeguard.common.models verify

      - name: Pytest
        run: python -m pytest

      - name: Fixture drift check
        run: python -m lifeguard.ai.sim.generate_fixtures --out tests/fixtures/synthetic --check

      - name: Mock replay
        run: python -m lifeguard.app.replay_mock --ai-config configs/ai.yaml --system-config configs/system.yaml

      - name: Integrated runtime (synthetic)
        run: python -m lifeguard.app.main --ai-config configs/ai.yaml --system-config configs/system.yaml --synthetic
