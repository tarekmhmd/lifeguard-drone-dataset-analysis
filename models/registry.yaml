# Paths are relative to this file. Weights (*.pt, *.onnx, *.engine) are never committed to git.
# Name convention: <task>_<arch>_<data>_v<n>.
#
# Pool detectors trained on 2026-11-24/25 are registered below (docs/MODEL_TRAINING_REPORT.md). The weights
# are not committed: copy them into this folder before using configs/ai_z5cc.yaml or configs/ai_ddt.yaml.
# To add a model: python -m lifeguard.common.models hash path/to/file   -> copy the sha256 into a new entry.
#
# Example (do not uncomment until the weights are approved and their checksum is recorded):
# - name: detector_yolo11n_coco_v1
#   version: 1.0.0
#   kind: detector
#   path: yolo11n_coco_v1.pt
#   sha256: <64 hex characters>
#   url: <official download URL>
#   mock: false
#   description: COCO-pretrained YOLO11n, person class only; NOT validated on pool video.
