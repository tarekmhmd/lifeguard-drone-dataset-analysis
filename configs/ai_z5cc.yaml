# Member 1 configuration for the REAL engine with the pool-trained Z5cc detector (roadmap P4-7).
# Requires: pip install -e ".[vision]" and the weights file below (*.pt is git-ignored).
#
# Model: YOLO11s fine-tuned on Z5cc pool video (side-view cameras), classes [swimming, drowning],
# trained at imgsz 448 on 49 videos (train+val). Held-out test split (6 unseen videos):
# mAP50 0.704, mAP50-95 0.330; drowning class AP50 0.649, precision 0.737, recall 0.633.
# Both classes are mapped to PERSON: the detector only localises people. Its drowning confidence is
# passed on as a 2 s mean per swimmer; the risk engine turns it into a PRE_ALERT ("check this swimmer")
# only when risk.detector_distress_threshold is set, never into an ALARM by itself.
engine: yolo
yolo:
  weights: ../models/z5cc_s448_final.pt
  conf: 0.1                       # low on purpose: ByteTrack's second stage uses low-confidence boxes
  iou: 0.7
  imgsz: 448                      # must match training
  device: null                    # "0" for the first GPU, "cpu", or null for the Ultralytics default
  person_class_ids: [0, 1]        # swimming, drowning -> PERSON
  distress_class_ids: [1]         # "drowning" confidence -> per-track 2 s mean feature det_distress_2s
behavior: none                    # "rules" enables the unvalidated rules baseline (risk weight stays 0)
# Model registry (M2-12): the weights file must match its sha256 entry in models/registry.yaml.
model_registry: ../models/registry.yaml
